services:
  # ==========================================
  # 1. BASES DE DATOS
  # ==========================================
  db_rutinas_pg:
    image: postgres:15-alpine
    container_name: calisaas_db_rutinas
    environment:
      POSTGRES_DB: rutinas_db
      POSTGRES_USER: admin_pg
      POSTGRES_PASSWORD: ${DB_PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - calisaas_network

  db_usuarios_ora:
    image: mysql:8.0
    container_name: calisaas_db_usuarios
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: admin_mysql
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - calisaas_network

  db_auditoria_mongo:
    image: mongo:6.0
    container_name: calisaas_db_auditoria
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_mongo
      MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - calisaas_network

  # ==========================================
  # 2. KEYCLOAK (Identidad)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: calisaas_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db_rutinas_pg:5432/rutinas_db
      KC_DB_USERNAME: admin_pg
      KC_DB_PASSWORD: ${DB_PG_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    ports:
      - "8082:8080"
    volumes:
      - ./themes/calisaas:/opt/keycloak/themes/calisaas:ro
    depends_on:
      - db_rutinas_pg
    networks:
      - calisaas_network

  # ==========================================
  # 3. MENSAJERÍA: ZOOKEEPER & KAFKA
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: calisaas_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - calisaas_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: calisaas_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP}:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - calisaas_network

  # ==========================================
  # 4. KAFKA UI
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: calisaas_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - calisaas_network

  # ==========================================
  # 5. MICROSERVICIO RUTINAS (DJANGO)
  # ==========================================
  ms_rutinas_django:
    build: ./ms_rutinas_django
    container_name: calisaas_ms_rutinas_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./ms_rutinas_django:/app
    ports:
      - "8000:8000"
    environment:
      - HOST_IP=${HOST_IP}
    depends_on:
      - db_rutinas_pg
      - kafka
      - keycloak
    networks:
      - calisaas_network

volumes:
  postgres_data:
  mysql_data:
  mongo_data:

networks:
  calisaas_network:
    driver: bridge
