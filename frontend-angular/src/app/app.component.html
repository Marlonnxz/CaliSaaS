<header class="header">
  <div style="display: flex; align-items: center; gap: 10px;">
    <img [src]="logoUrl" alt="Logo Gimnasio" style="height: 40px; border-radius: 8px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
    <div style="display: none; width: 32px; height: 32px; background: var(--primary-color); border-radius: 8px; align-items: center; justify-content: center; color: white; font-weight: bold;">
      C
    </div>
    <h2>{{ title }}</h2>
  </div>
  <nav class="header-nav">
    @if (authService.isLoggedIn()) {
      <button class="btn btn-secondary" routerLink="/dashboard">Mi Panel</button>
      <button class="btn btn-primary" (click)="logout()">Cerrar Sesión</button>
    }
  </nav>
</header>
<main class="container">
  @if (authService.isLoggedIn()) {
    <router-outlet></router-outlet>
  } @else {
    <div style="max-width: 450px; margin: 8vh auto 0 auto;">
      <div class="card" style="padding: 2.5rem; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--text-primary), var(--primary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Ingresar al Sistema
          </h2>
          <p style="color: var(--text-secondary); font-size: 0.95rem;">
            Introduce tus credenciales de {{ title }}
          </p>
        </div>

        <form (submit)="onLogin(userInput.value, passInput.value, $event)">
          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="username">Usuario</label>
            <input 
              #userInput
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="Ej. owner_norte o atleta_sur" 
              required
              [disabled]="isLoading"
              style="padding: 0.85rem 1.1rem; border: 1px solid var(--border-color);"
            >
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              #passInput
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
              [disabled]="isLoading"
              style="padding: 0.85rem 1.1rem; border: 1px solid var(--border-color);"
            >
          </div>

          @if (errorMessage) {
            <div style="margin-bottom: 1.5rem; padding: 0.85rem 1.1rem; background-color: #fef2f2; color: #ef4444; border-radius: var(--radius-md); font-size: 0.875rem; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 500;">
              ⚠️ {{ errorMessage }}
            </div>
          }

          <button 
            type="submit" 
            class="btn btn-primary" 
            [disabled]="isLoading"
            style="width: 100%; padding: 0.9rem; font-size: 1rem; border-radius: var(--radius-md); margin-top: 0.5rem;"
          >
            @if (isLoading) {
              <span style="display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%;">
                <svg class="spinner" viewBox="0 0 50 50" style="width: 20px; height: 20px; animation: rotate 2s linear infinite; stroke: white; display: inline-block;">
                  <circle cx="25" cy="25" r="20" fill="none" stroke-width="5" stroke-linecap="round" style="stroke-dasharray: 1, 150; stroke-dashoffset: 0; animation: dash 1.5s ease-in-out infinite;"></circle>
                </svg>
                Iniciando sesión...
              </span>
            } @else {
              Iniciar Sesión
            }
          </button>
        </form>
      </div>
    </div>
  }
</main>
